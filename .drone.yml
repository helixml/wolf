---
kind: pipeline
type: docker
name: test-build

trigger:
  event:
    - pull_request
    - push

steps:
  - name: test-wolf-build
    image: plugins/docker
    environment:
      DOCKER_BUILDKIT: 1
    settings:
      dockerfile: docker/wolf.Dockerfile
      repo: registry.helixml.tech/helix/wolf
      username: admin
      password:
        from_secret: helix_registry_password
      tags:
        - ${DRONE_COMMIT_SHA:0:8}
      dry_run: true
      build_args:
        - BASE_IMAGE=ghcr.io/games-on-whales/gstreamer:1.26.7

---
kind: pipeline
type: docker
name: publish-release

trigger:
  event:
    - tag

steps:
  - name: publish-wolf-release
    image: plugins/docker
    environment:
      DOCKER_BUILDKIT: 1
    settings:
      dockerfile: docker/wolf.Dockerfile
      registry: registry.helixml.tech
      repo: registry.helixml.tech/helix/wolf
      username: admin
      password:
        from_secret: helix_registry_password
      tags:
        - ${DRONE_TAG}
        - latest
      build_args:
        - BASE_IMAGE=ghcr.io/games-on-whales/gstreamer:1.26.7
