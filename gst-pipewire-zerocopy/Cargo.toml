[package]
name = "gst-plugin-pipewire-zerocopy"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "GStreamer PipeWire source with zero-copy GPU buffer handling"
repository = "https://github.com/games-on-whales/wolf"

[dependencies]
# GStreamer bindings
gst = { version = "0.23.2", package = "gstreamer", features = ["v1_24"] }
gst-base = { version = "0.23.2", package = "gstreamer-base", features = ["v1_24"] }
gst-video = { version = "0.23.2", package = "gstreamer-video", features = ["v1_24"] }
gstreamer-allocators = "0.23"

# PipeWire bindings
pipewire = "0.8"
libspa = "0.8"

# Reuse CUDA/EGL allocator from gst-wayland-display (battle-tested)
waylanddisplaycore = { git = "https://github.com/games-on-whales/gst-wayland-display", package = "wayland-display-core", features = ["cuda"] }

# smithay for Dmabuf type (re-exported by waylanddisplaycore but need for pipewire_stream)
smithay = { version = "0.3", default-features = false, features = ["backend_drm", "backend_egl"] }

# Utilities
tracing = "0.1"
once_cell = "1.17"
parking_lot = "0.12"
libc = "0.2"

[lib]
name = "gstpipewirezerocopy"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
gst-plugin-version-helper = "0.8"

[features]
default = ["cuda"]
cuda = []

[package.metadata.capi]
min_version = "0.9.21"

[package.metadata.capi.header]
enabled = false

[package.metadata.capi.library]
name = "gstpipewirezerocopy"
version_suffix_components = 0

[package.metadata.capi.pkg_config]
requires_private = "gstreamer-1.0, gstreamer-base-1.0, gstreamer-video-1.0"
